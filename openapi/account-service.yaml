openapi: 3.1.0
info:
  title: Account Service API
  version: 1.0.0
  description: Internal API called synchronously by the Event Gateway.
servers:
  - url: http://localhost:8081
security:
  - serviceApiKey: []
paths:
  /accounts/{accountId}/transactions:
    post:
      operationId: applyTransaction
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '201':
          description: New transaction applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '200':
          description: Identical transaction already applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{accountId}/balance:
    get:
      operationId: getBalance
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sum of credits minus sum of debits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /accounts/{accountId}:
    get:
      operationId: getAccountDetails
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
        - in: query
          name: recentLimit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Account balance and recent transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      operationId: accountServiceHealth
      responses:
        '200': { description: Service and database are available }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Database unavailable }
components:
  securitySchemes:
    serviceApiKey:
      type: apiKey
      in: header
      name: X-Service-Api-Key
  schemas:
    TransactionRequest:
      type: object
      additionalProperties: false
      required: [eventId, accountId, type, amount, currency, eventTimestamp]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 100 }
        accountId: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        eventTimestamp: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    TransactionResponse:
      allOf:
        - $ref: '#/components/schemas/TransactionRequest'
        - type: object
          properties:
            appliedAt: { type: string, format: date-time }
    BalanceResponse:
      type: object
      properties:
        accountId: { type: string }
        balance: { type: number }
        currency: { type: string }
        asOf: { type: string, format: date-time }
    AccountResponse:
      type: object
      properties:
        accountId: { type: string }
        balance: { type: number }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        recentTransactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionResponse' }
    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        details: { type: array, items: { type: object } }
  responses:
    BadRequest:
      description: Invalid transaction
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Event ID or currency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Account not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: A valid Gateway service API key is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
