spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:h2:file:./data/account-db;AUTO_SERVER=TRUE}
    username: ${ACCOUNT_DB_USERNAME:sa}
    password: ${ACCOUNT_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${ACCOUNT_SERVICE_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

event-ledger:
  security:
    # Development-only default. Always override this outside local/demo use.
    service-api-key: ${ACCOUNT_SERVICE_API_KEY:local-service-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: ${spring.application.name}
