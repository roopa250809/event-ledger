services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.153.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    expose:
      - "4317"
      - "4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    expose:
      - "9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      ACCOUNT_DB_URL: jdbc:h2:file:/data/account-db
      ACCOUNT_SERVICE_PORT: 8081
      ACCOUNT_SERVICE_API_KEY: ${ACCOUNT_SERVICE_API_KEY:-local-service-key-change-me}
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    expose:
      - "8081"
    volumes:
      - account-data:/data
    restart: unless-stopped

  event-gateway:
    build:
      context: .
      dockerfile: event-gateway/Dockerfile
    environment:
      GATEWAY_DB_URL: jdbc:h2:file:/data/gateway-db
      ACCOUNT_SERVICE_URL: http://account-service:8081
      ACCOUNT_SERVICE_API_KEY: ${ACCOUNT_SERVICE_API_KEY:-local-service-key-change-me}
      GATEWAY_PORT: 8080
      GATEWAY_JWT_ISSUER: ${GATEWAY_JWT_ISSUER:-event-ledger-local}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-event-ledger-api}
      GATEWAY_JWT_JWK_SET_URI: ${GATEWAY_JWT_JWK_SET_URI:-}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-ZXZlbnQtbGVkZ2VyLWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWU=}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_FALLBACK_ENABLED: ${KAFKA_FALLBACK_ENABLED:-true}
      KAFKA_FALLBACK_TOPIC: ${KAFKA_FALLBACK_TOPIC:-event-ledger.account-retry.v1}
      KAFKA_RETRY_INTERVAL: ${KAFKA_RETRY_INTERVAL:-5s}
      ACCOUNT_RETRY_INITIAL_WAIT: ${ACCOUNT_RETRY_INITIAL_WAIT:-200ms}
      ACCOUNT_RETRY_MULTIPLIER: ${ACCOUNT_RETRY_MULTIPLIER:-2.0}
      ACCOUNT_RETRY_JITTER_FACTOR: ${ACCOUNT_RETRY_JITTER_FACTOR:-0.5}
      ACCOUNT_RETRY_MAX_WAIT: ${ACCOUNT_RETRY_MAX_WAIT:-2s}
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gateway-data:/data
    depends_on:
      account-service:
        condition: service_started
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
  account-data:
  gateway-data:
