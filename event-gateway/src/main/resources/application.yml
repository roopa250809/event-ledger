spring:
  application:
    name: event-gateway
  datasource:
    url: ${GATEWAY_DB_URL:jdbc:h2:file:./data/gateway-db;AUTO_SERVER=TRUE}
    username: ${GATEWAY_DB_USERNAME:sa}
    password: ${GATEWAY_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 3000
        request.timeout.ms: 1000
        max.block.ms: 1000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:event-gateway-fallback}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  ssl:
    enabled: ${GATEWAY_SSL_ENABLED:false}
    key-store: ${GATEWAY_SSL_KEY_STORE:classpath:tls/gateway.p12}
    key-store-password: ${GATEWAY_SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: ${GATEWAY_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${GATEWAY_SSL_KEY_ALIAS:event-gateway}

event-ledger:
  kafka:
    enabled: ${KAFKA_FALLBACK_ENABLED:true}
    topic: ${KAFKA_FALLBACK_TOPIC:event-ledger.account-retry.v1}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:3s}
    retry-interval: ${KAFKA_RETRY_INTERVAL:5s}
  security:
    jwt:
      issuer: ${GATEWAY_JWT_ISSUER:event-ledger-local}
      audience: ${GATEWAY_JWT_AUDIENCE:event-ledger-api}
      jwk-set-uri: ${GATEWAY_JWT_JWK_SET_URI:}
      # Development-only default. Always override this outside local/demo use.
      secret: ${GATEWAY_JWT_SECRET:ZXZlbnQtbGVkZ2VyLWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWU=}
    rate-limit:
      requests-per-minute: ${GATEWAY_RATE_LIMIT_PER_MINUTE:120}

account-service:
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${ACCOUNT_CONNECT_TIMEOUT:500ms}
  read-timeout: ${ACCOUNT_READ_TIMEOUT:1s}
  retry:
    initial-wait: ${ACCOUNT_RETRY_INITIAL_WAIT:200ms}
    multiplier: ${ACCOUNT_RETRY_MULTIPLIER:2.0}
    jitter-factor: ${ACCOUNT_RETRY_JITTER_FACTOR:0.5}
    max-wait: ${ACCOUNT_RETRY_MAX_WAIT:2s}
  # Development-only default. Gateway and Account Service must use the same override.
  api-key: ${ACCOUNT_SERVICE_API_KEY:local-service-key-change-me}

resilience4j:
  retry:
    instances:
      accountService:
        max-attempts: 3
        retry-exceptions:
          - com.eventledger.gateway.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.eventledger.gateway.client.AccountServiceRejectedException
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.eventledger.gateway.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.eventledger.gateway.client.AccountServiceRejectedException

management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: ${spring.application.name}
