spring:
  application:
    name: event-gateway
  datasource:
    url: jdbc:h2:mem:gateway-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
account-service:
  base-url: http://localhost:${wiremock.server.port:18081}
  connect-timeout: 100ms
  read-timeout: 200ms
  api-key: test-service-key-1234567890
  retry:
    initial-wait: 10ms
    multiplier: 2.0
    jitter-factor: 0.25
    max-wait: 20ms
event-ledger:
  kafka:
    enabled: false
  security:
    jwt:
      issuer: event-ledger-local
      audience: event-ledger-api
      jwk-set-uri: ""
      secret: ZXZlbnQtbGVkZ2VyLWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWU=
    rate-limit:
      requests-per-minute: 1000
resilience4j:
  retry:
    instances:
      accountService:
        max-attempts: 2
        retry-exceptions:
          - com.eventledger.gateway.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.eventledger.gateway.client.AccountServiceRejectedException
  circuitbreaker:
    instances:
      accountService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        record-exceptions:
          - com.eventledger.gateway.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.eventledger.gateway.client.AccountServiceRejectedException
management:
  tracing:
    sampling:
      probability: 1.0
